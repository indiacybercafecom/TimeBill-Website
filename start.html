<body>

  <script type="module">
    const databaseUrl = "https://timebill-icc-default-rtdb.firebaseio.com";
    const guestStorageKey = "timebill_web_guest_id";
    const guestId = localStorage.getItem(guestStorageKey) || `guest_${crypto.randomUUID().slice(0, 8)}`;
    localStorage.setItem(guestStorageKey, guestId);
    const rootPath = `users/${guestId}`;
    const byId = (id) => document.getElementById(id);
    const ui = {
      timer: byId("timer-display"), earnings: byId("earnings-value"), state: byId("timer-state"),
      action: byId("main-action"), actionIcon: byId("main-action-icon"), actionLabel: byId("main-action-label"),
      headerPlay: byId("header-play"), rate: byId("hourly-rate"), client: byId("client-name"),
      status: byId("sync-status"), dialog: byId("action-dialog"), dialogTitle: byId("dialog-title"),
      dialogContent: byId("dialog-content"), toast: byId("toast")
    };
    let running = false;
    let paused = false;
    let startedAt = 0;
    let accumulated = 0;
    let sessionRate = 0;
    let sessionClient = "";
    let selectedView = "home";
    let rateSaveTimer;
    let toastTimer;
    let clients = [];
    let sessions = [];

    function pathUrl(path) {
      return `${databaseUrl}/${path.split("/").map(encodeURIComponent).join("/")}.json`;
    }

    async function databaseRequest(path, method = "GET", body) {
      const response = await fetch(pathUrl(path), {
        method,
        headers: body === undefined ? undefined : { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`Database request failed (${response.status})`);
      return response.status === 204 ? null : response.json();
    }

    function setConnection(state, text) {
      ui.status.dataset.state = state;
      ui.status.textContent = text;
    }

    function showToast(message) {
      ui.toast.textContent = message;
      ui.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => ui.toast.classList.remove("show"), 2800);
    }

    function elapsedMilliseconds() {
      return accumulated + (running && !paused ? Date.now() - startedAt : 0);
    }

    function formatDuration(milliseconds) {
      const seconds = Math.floor(milliseconds / 1000);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds / 60) % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function parseRate(value) {
      const number = Number(value.trim().replace(",", "."));
      return Number.isFinite(number) && number >= 0 ? number : 0;
    }

    function money(value) {
      return `₹${Number(value || 0).toFixed(2)}`;
    }

    function renderTimer() {
      const elapsed = elapsedMilliseconds();
      ui.timer.textContent = formatDuration(elapsed);
      ui.earnings.textContent = money((elapsed / 3600000) * (running ? sessionRate : parseRate(ui.rate.value)));
      ui.action.classList.toggle("is-running", running);
      ui.actionIcon.textContent = running ? "stop" : "play_arrow";
      ui.actionLabel.textContent = running ? "Stop Tracking" : "Start Tracking";
      ui.action.setAttribute("aria-label", running ? "Stop tracking and save session" : "Start tracking");
      ui.headerPlay.querySelector(".material-symbols-outlined").textContent = running && !paused ? "pause" : "play_arrow";
      ui.headerPlay.setAttribute("aria-label", running && !paused ? "Pause tracking" : paused ? "Resume tracking" : "Start tracking");
      ui.headerPlay.title = running && !paused ? "Pause tracking" : paused ? "Resume tracking" : "Start tracking";
      ui.state.textContent = running ? paused ? "Paused" : "Tracking in progress" : "Ready to track";
    }

    function toggleTimer() {
      if (!running) {
        sessionRate = parseRate(ui.rate.value);
        sessionClient = ui.client.value.trim();
        startedAt = Date.now();
        accumulated = 0;
        running = true;
        paused = false;
        renderTimer();
        return;
      }
      if (paused) {
        startedAt = Date.now();
        paused = false;
      } else {
        accumulated += Date.now() - startedAt;
        paused = true;
      }
      renderTimer();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
    }

    function openDialog(title, content) {
      ui.dialogTitle.textContent = title;
      ui.dialogContent.replaceChildren();
      if (typeof content === "string") ui.dialogContent.innerHTML = content;
      else ui.dialogContent.append(content);
      if (!ui.dialog.open) ui.dialog.showModal();
    }

    function closeDrawer() {
      document.body.classList.remove("drawer-open");
      byId("drawer").setAttribute("aria-hidden", "true");
    }

    function openDrawer() {
      document.body.classList.add("drawer-open");
      byId("drawer").setAttribute("aria-hidden", "false");
      byId("close-menu").focus();
    }

    async function refreshClients() {
      const saved = await databaseRequest(`${rootPath}/clients`);
      clients = saved ? Object.entries(saved).map(([id, client]) => ({ id, ...client })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
    }

    async function chooseClient() {
      try { await refreshClients(); }
      catch { showToast("Could not load clients. Check your connection and try again."); return; }
      const rows = clients.map((client) => `<div class="list-row"><div class="list-main"><span class="list-title">${escapeHtml(client.clientName || "Unnamed Client")}</span>${client.mobile ? `<span class="list-subtitle">${escapeHtml(client.mobile)}</span>` : ""}</div><button class="small-button" type="button" data-select-client="${escapeHtml(client.id)}">Select</button></div>`).join("");
      openDialog("Select Client", `<input class="search-input" id="client-search" type="search" placeholder="Search clients" aria-label="Search clients"><div id="client-list">${rows || '<p class="empty-state">No saved clients yet.</p>'}</div><form class="dialog-form" id="new-client-form"><label class="field"><span class="field-label">Add Client</span><span class="input-wrap"><input name="clientName" required maxlength="100" placeholder="Client name"></span></label><button class="wide-action" type="submit">Save Client</button></form>`);
      byId("client-search").addEventListener("input", (event) => {
        const query = event.target.value.trim().toLowerCase();
        byId("client-list").innerHTML = clients.filter((client) => `${client.clientName || ""} ${client.mobile || ""}`.toLowerCase().includes(query)).map((client) => `<div class="list-row"><div class="list-main"><span class="list-title">${escapeHtml(client.clientName || "Unnamed Client")}</span>${client.mobile ? `<span class="list-subtitle">${escapeHtml(client.mobile)}</span>` : ""}</div><button class="small-button" type="button" data-select-client="${escapeHtml(client.id)}">Select</button></div>`).join("") || '<p class="empty-state">No matching clients.</p>';
      });
      byId("new-client-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const clientName = new FormData(event.currentTarget).get("clientName").trim();
        if (!clientName) return;
        try {
          await databaseRequest(`${rootPath}/clients`, "POST", { clientName, mobile: "", email: "", address: "", createdAt: Date.now(), updatedAt: Date.now() });
          await refreshClients();
          ui.client.value = clientName;
          ui.dialog.close();
          showToast("Client saved and selected.");
        } catch { showToast("Could not save client. Check your connection and try again."); }
      });
    }

    async function refreshSessions() {
      const saved = await databaseRequest(`${rootPath}/sessions`);
      sessions = saved ? Object.entries(saved).map(([id, session]) => ({ id, ...session })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)) : [];
    }

    function sessionRows(items) {
      return items.map((session) => {
        const stamp = Number(session.timestamp || session.createdAt || 0);
        const date = stamp ? new Date(stamp).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "Date unavailable";
        return `<div class="list-row"><div class="list-main"><span class="list-title">${escapeHtml(session.clientName || "Unnamed Client")}</span><span class="list-subtitle">${escapeHtml(formatDuration(Number(session.durationMillis || 0)))} · ${escapeHtml(date)}</span></div><span class="list-money">${escapeHtml(money(session.earnings))}</span><button class="small-button danger" type="button" data-delete-session="${escapeHtml(session.id)}" aria-label="Delete session">Delete</button></div>`;
      }).join("");
    }

    async function showHistory() {
      try { await refreshSessions(); }
      catch { showToast("Could not load session history. Check your connection and try again."); return; }
      openDialog("Session History", `<input class="search-input" id="history-search" type="search" placeholder="Search by client" aria-label="Search sessions"><div id="session-list">${sessionRows(sessions) || '<p class="empty-state">No sessions recorded yet.</p>'}</div><button class="small-button danger" id="delete-all-sessions" type="button" ${sessions.length ? "" : "disabled"}>Delete All</button>`);
      byId("history-search").addEventListener("input", (event) => {
        const query = event.target.value.trim().toLowerCase();
        const filtered = sessions.filter((session) => (session.clientName || "Unnamed Client").toLowerCase().includes(query));
        byId("session-list").innerHTML = sessionRows(filtered) || '<p class="empty-state">No matching sessions.</p>';
      });
      byId("delete-all-sessions").addEventListener("click", async () => {
        if (!sessions.length || !confirm("Delete all saved sessions? This cannot be undone.")) return;
        try { await databaseRequest(`${rootPath}/sessions`, "DELETE"); await showHistory(); showToast("All sessions deleted."); }
        catch { showToast("Could not delete sessions. Try again."); }
      });
    }

    async function showReports() {
      try { await refreshSessions(); }
      catch { showToast("Could not load reports. Check your connection and try again."); return; }
      const totalMillis = sessions.reduce((sum, session) => sum + Number(session.durationMillis || 0), 0);
      const totalEarnings = sessions.reduce((sum, session) => sum + Number(session.earnings || 0), 0);
      const today = new Date();
      const todayEarnings = sessions.reduce((sum, session) => {
        const date = new Date(Number(session.timestamp || 0));
        return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate() ? sum + Number(session.earnings || 0) : sum;
      }, 0);
      openDialog("Reports", `<div class="summary-grid"><div class="summary-value"><span>Total Hours</span><strong>${Math.floor(totalMillis / 3600000)}h ${Math.floor(totalMillis / 60000) % 60}m</strong></div><div class="summary-value"><span>Total Earnings</span><strong>${escapeHtml(money(totalEarnings))}</strong></div><div class="summary-value"><span>Total Sessions</span><strong>${sessions.length}</strong></div><div class="summary-value"><span>Today's Earnings</span><strong>${escapeHtml(money(todayEarnings))}</strong></div></div>`);
    }

    async function showClients() {
      try { await refreshClients(); }
      catch { showToast("Could not load clients. Check your connection and try again."); return; }
      const rows = clients.map((client) => `<div class="list-row"><div class="list-main"><span class="list-title">${escapeHtml(client.clientName || "Unnamed Client")}</span>${client.mobile ? `<span class="list-subtitle">${escapeHtml(client.mobile)}</span>` : ""}</div><button class="small-button danger" type="button" data-delete-client="${escapeHtml(client.id)}">Delete</button></div>`).join("");
      openDialog("Clients", `<div>${rows || '<p class="empty-state">No saved clients yet.</p>'}</div><form class="dialog-form" id="manage-client-form"><label class="field"><span class="field-label">Add Client</span><span class="input-wrap"><input name="clientName" required maxlength="100" placeholder="Client name"></span></label><button class="wide-action" type="submit">Save Client</button></form>`);
      byId("manage-client-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const clientName = new FormData(event.currentTarget).get("clientName").trim();
        if (!clientName) return;
        try { await databaseRequest(`${rootPath}/clients`, "POST", { clientName, mobile: "", email: "", address: "", createdAt: Date.now(), updatedAt: Date.now() }); await showClients(); showToast("Client saved."); }
        catch { showToast("Could not save client. Try again."); }
      });
    }

    async function stopAndSave() {
      if (!running) { toggleTimer(); return; }
      const durationMillis = elapsedMilliseconds();
      const endTime = Date.now();
      const session = {
        clientName: sessionClient,
        hourlyRate: sessionRate,
        startTime: endTime - durationMillis,
        endTime,
        durationMillis,
        earnings: (durationMillis / 3600000) * sessionRate,
        status: "Work Completed",
        createdAt: endTime,
        timestamp: endTime
      };
      running = false;
      paused = false;
      accumulated = 0;
      startedAt = 0;
      renderTimer();
      try {
        await databaseRequest(`${rootPath}/sessions`, "POST", session);
        showToast(`Session saved · ${money(session.earnings)}`);
      } catch {
        showToast("Session could not be saved. Check your connection and try again.");
      }
    }

    byId("dialog-close").addEventListener("click", () => ui.dialog.close());
    ui.dialog.addEventListener("click", (event) => { if (event.target === ui.dialog) ui.dialog.close(); });
    ui.dialogContent.addEventListener("click", async (event) => {
      const select = event.target.closest("[data-select-client]");
      if (select) {
        const client = clients.find((item) => item.id === select.dataset.selectClient);
        if (client) ui.client.value = client.clientName || "";
        ui.dialog.close();
      }
      const deleteSession = event.target.closest("[data-delete-session]");
      if (deleteSession && confirm("Delete this session?")) {
        try { await databaseRequest(`${rootPath}/sessions/${deleteSession.dataset.deleteSession}`, "DELETE"); await showHistory(); }
        catch { showToast("Could not delete the session. Try again."); }
      }
      const deleteClient = event.target.closest("[data-delete-client]");
      if (deleteClient && confirm("Delete this client?")) {
        try { await databaseRequest(`${rootPath}/clients/${deleteClient.dataset.deleteClient}`, "DELETE"); await showClients(); }
        catch { showToast("Could not delete the client. Try again."); }
      }
    });

    byId("main-action").addEventListener("click", stopAndSave);
    byId("header-play").addEventListener("click", toggleTimer);
    byId("history-button").addEventListener("click", showHistory);
    byId("select-client").addEventListener("click", chooseClient);
    ui.client.addEventListener("click", chooseClient);
    byId("menu-button").addEventListener("click", openDrawer);
    byId("close-menu").addEventListener("click", closeDrawer);
    byId("drawer-scrim").addEventListener("click", closeDrawer);
    document.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => {
      selectedView = button.dataset.view;
      document.querySelectorAll("[data-view]").forEach((item) => item.removeAttribute("aria-current"));
      button.setAttribute("aria-current", "page");
      closeDrawer();
      if (selectedView === "home" && ui.dialog.open) ui.dialog.close();
      if (selectedView === "history") showHistory();
      if (selectedView === "reports") showReports();
      if (selectedView === "clients") showClients();
    }));

    ui.rate.addEventListener("input", () => {
      renderTimer();
      clearTimeout(rateSaveTimer);
      rateSaveTimer = setTimeout(async () => {
        try { await databaseRequest(`${rootPath}/profile/defaultHourlyRate`, "PUT", parseRate(ui.rate.value)); setConnection("ok", "Synced"); }
        catch { setConnection("error", "Offline"); }
      }, 450);
    });
    ui.rate.addEventListener("blur", () => {
      const rate = parseRate(ui.rate.value);
      ui.rate.value = rate === 0 ? "" : Number.isInteger(rate) ? String(rate) : rate.toFixed(2);
      renderTimer();
    });
    ui.rate.addEventListener("keydown", (event) => { if (event.key === "Enter") ui.rate.blur(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDrawer(); });

    async function initialize() {
      renderTimer();
      try {
        const savedRate = await databaseRequest(`${rootPath}/profile/defaultHourlyRate`);
        if (typeof savedRate === "number" && savedRate > 0) ui.rate.value = Number.isInteger(savedRate) ? String(savedRate) : savedRate.toFixed(2);
        setConnection("ok", "Synced");
      } catch {
        setConnection("error", "Offline");
        showToast("Could not connect to TimeBill sync. Check your connection.");
      }
      renderTimer();
    }

    setInterval(renderTimer, 250);
    initialize();
  </script>
</body>
</html>
